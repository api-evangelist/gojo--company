aid: gojo--company
name: Gojo & Company
description: 'Gojo & Company, Inc. is a Tokyo-headquartered financial inclusion holding
  company founded on 4 July 2014 by Taejun Shin and Sanjay Gandhi, with the stated
  ambition of becoming a "private-sector World Bank". Gojo raises capital from mission-aligned
  investors and deploys it into microfinance institutions and inclusive financial service
  providers across South Asia, Southeast Asia, Central Asia, the Caucasus and Africa,
  supplying not only equity and debt but also management, governance, risk and technology
  support to its group companies. It runs a Financial Diaries research programme on
  low-income household cashflows, the Pasio digital financial inclusion initiative,
  and a non-profit arm, the Gojo Foundation. Gojo is a certified B Corporation and
  reports under J-GAAP. It is a private company; its equity trades on secondary marketplaces
  such as Hiive. Gojo publishes no public developer program, API documentation, or
  machine-readable API contract — its digital financial infrastructure and cloud core
  banking work is internal to the group and its partner institutions.'
